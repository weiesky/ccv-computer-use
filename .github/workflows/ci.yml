name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm 10 mis-resolves sharp's platform-specific optional deps
      # (https://github.com/sharp-pixel/sharp/issues); pin npm 11 everywhere.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
